name: Monitoring cron

# Vercel Hobby restricts cron job frequency more than this app needs, so
# GitHub Actions is the primary trigger for /api/cron/monitoring — see
# docs/INTEGRATION.md. vercel.json's own cron entry still runs as a backup,
# at whatever cadence Hobby allows.
#
# This runs every 30 minutes so segments close to departure (which
# lib/monitoring/service.ts polls as often as every 30min) actually get
# checked that often — the route itself is a no-op for any segment whose
# nextCheckAt hasn't passed, so the extra invocations don't cost quota.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monitoring check
        run: |
          # Demo deployment (maestravl-demo repo) — set the MONITORING_BASE_URL
          # repository variable if the Vercel URL differs. For production:
          # www.maestravl.com, not the bare apex — maestravl.com 308-redirects
          # to www, and this curl doesn't follow redirects (-L), so pointing
          # at the apex would "succeed" without ever actually hitting the
          # monitoring route.
          curl -sf -X GET "${{ vars.MONITORING_BASE_URL || 'https://maestravl-demo.vercel.app' }}/api/cron/monitoring" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
